[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "install", "log"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "auto_aim_interfaces",
    "livox_interfaces",
    "rm_vision_bringup",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true
